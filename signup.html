<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div class="fixed right-4 top-4 z-10"><button type="button" data-theme-toggle class="btn !p-2" aria-label="Toggle dark mode" title="Toggle dark mode"><span class="t-moon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></span><span class="t-sun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></button></div><div class="grid min-h-screen lg:grid-cols-[1.05fr_1fr]">
<div class="hidden flex-col justify-between bg-gradient-to-br from-navy-900 to-navy-600 p-12 text-white lg:flex"><div class="flex items-center gap-3"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 30 29H2z" fill="#F2B705"/><path d="M16 12 21.5 23h-11z" fill="#0A1228"/></svg><span class="font-semibold tracking-[.14em]">DELTABLOCK</span></div>
<div><div class="mb-8 w-72"><svg viewBox="0 0 320 240" class="w-full" aria-hidden="true"><rect x="40" y="30" width="170" height="110" rx="14" fill="#fff" opacity=".1"/><path d="M55 120 90 90l30 20 40-45 35 25" fill="none" stroke="#F2B705" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="150" width="14" height="40" rx="3" fill="#fff" opacity=".25"/><rect x="84" y="136" width="14" height="54" rx="3" fill="#fff" opacity=".25"/><rect x="108" y="120" width="14" height="70" rx="3" fill="#F2B705" opacity=".8"/><rect x="132" y="142" width="14" height="48" rx="3" fill="#fff" opacity=".25"/></svg></div><h2 class="max-w-md text-3xl font-semibold leading-tight">Liquidity insight for listed companies.</h2><p class="mt-3 max-w-md text-[#AEB8CE]">Track volume, spread and participation in one secure workspace.</p></div><p class="text-xs text-[#AEB8CE]">© 2026 Deltablock</p></div>
<div class="grid place-items-center bg-surf p-6"><div class="w-full max-w-md"><h1 class="text-2xl font-semibold tracking-tight">Create account</h1><p class="mb-6 mt-1 text-sm text-mut">Fill in the form below to get started.</p>
<form action="dashboard.html" class="grid gap-4 sm:grid-cols-2"><div class=""><label class="lbl" for="fn">First name</label><input id="fn" name="fn" type="text" class="inp" placeholder="" required></div><div class=""><label class="lbl" for="ln">Last name</label><input id="ln" name="ln" type="text" class="inp" placeholder="" required></div><div class="sm:col-span-2"><label class="lbl" for="em">Email</label><input id="em" name="em" type="email" class="inp" placeholder="name@company.com" required></div><div class="sm:col-span-2"><label class="lbl" for="pw">Password</label><input id="pw" name="pw" type="password" class="inp" placeholder="Create a password" required></div><div class=""><label class="lbl" for="ph">Phone</label><input id="ph" name="ph" type="tel" class="inp" placeholder="+1 555 000 0000" required></div><div class=""><label class="lbl" for="pos">Position</label><input id="pos" name="pos" type="text" class="inp" placeholder="" required></div><div class="sm:col-span-2"><label class="lbl" for="ad">Address</label><input id="ad" name="ad" type="text" class="inp" placeholder="Street, city, country" required></div>
<div class="mt-2 flex justify-between sm:col-span-2"><a href="login.html" class="btn">Back to login</a><button class="btn btn-p">Next</button></div></form></div></div></div><div id="choose" class="modal" role="dialog" aria-modal="true" aria-labelledby="ct"><div class="card w-full max-w-md p-8 text-center"><h2 id="ct" class="text-xl font-semibold">Are you already a client?</h2><p class="mb-6 mt-2 text-sm text-mut">Please choose if you are a client or a guest.</p><div class="flex justify-center gap-3"><a href="#" class="btn">Guest</a><a href="#" class="btn btn-p">Client</a></div></div></div>
</body>
</html>
